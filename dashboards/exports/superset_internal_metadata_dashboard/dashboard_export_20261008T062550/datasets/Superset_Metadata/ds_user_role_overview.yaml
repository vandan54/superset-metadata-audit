table_name: ds_user_role_overview
main_dttm_col: user_created_date
description: null
default_endpoint: null
offset: 0
cache_timeout: null
schema: public
sql: "SELECT \r\n    u.id AS user_id,\r\n    u.first_name || ' ' || u.last_name AS\
  \ full_name,\r\n    u.username,\r\n    u.email,\r\n    CASE WHEN u.active = true\
  \ THEN 'Active' ELSE 'Inactive' END AS account_status,\r\n    u.created_on AS user_created_date,\r\
  \n    u.last_login,\r\n    COALESCE(r.name, 'No Role Assigned') AS role_name\r\n\
  FROM ab_user u\r\nLEFT JOIN ab_user_role ur ON u.id = ur.user_id\r\nLEFT JOIN ab_role\
  \ r ON ur.role_id = r.id;"
