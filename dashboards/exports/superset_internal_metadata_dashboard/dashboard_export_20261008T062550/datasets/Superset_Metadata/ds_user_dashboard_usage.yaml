table_name: ds_user_dashboard_usage
main_dttm_col: event_timestamp
description: null
default_endpoint: null
offset: 0
cache_timeout: null
schema: public
sql: "SELECT \r\n    l.id AS log_id,\r\n    l.dttm AS event_timestamp,\r\n    CAST(l.dttm\
  \ AS DATE) AS event_date,\r\n    u.username,\r\n    u.first_name || ' ' || u.last_name\
  \ AS user_full_name,\r\n    d.id AS dashboard_id,\r\n    COALESCE(d.dashboard_title,\
  \ 'Direct Chart/Explore') AS dashboard_title,\r\n    l.action,\r\n    l.duration_ms\r\
  \nFROM logs l\r\nJOIN ab_user u ON l.user_id = u.id\r\nLEFT JOIN dashboards d ON\
  \ l.dashboard_id = d.id\r\nWHERE l.action IN ('dashboard', 'explore', 'explore_json');"
