schema: public
sql: "SELECT \r\n    d.id AS dashboard_id,\r\n    d.dashboard_title,\r\n    d.created_on\
  \ AS dashboard_created_at,\r\n    creator.username AS created_by_user,\r\n    COUNT(l.id)\
  \ AS total_views,\r\n    COUNT(DISTINCT l.user_id) AS unique_viewers,\r\n    MAX(l.dttm)\
  \ AS last_accessed_at\r\nFROM dashboards d\r\nLEFT JOIN logs l ON d.id = l.dashboard_id\
  \ AND l.action IN ('dashboard', 'explore_json')\r\nLEFT JOIN ab_user creator ON\
  \ d.created_by_fk = creator.id\r\nGROUP BY d.id, d.dashboard_title, d.created_on,\
  \ creator.username;"
